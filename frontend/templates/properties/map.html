{% extends 'base.html' %}
{% load static %}

{% block title %}Map View{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3 px-3">
        <h4 class="mb-0"><i class="fas fa-map-marked-alt text-primary me-2"></i>Property Map</h4>
        <a href="{% url 'properties:search' %}" class="btn btn-outline-primary btn-sm">
            <i class="fas fa-list me-1"></i> List View
        </a>
    </div>
    <div id="map"></div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{% static 'js/map.js' %}"></script>
<script>
    const properties = {{ props_json|safe }};
    document.addEventListener('DOMContentLoaded', function() {
        initMap(properties);
    });
</script>
{% endblock %}
