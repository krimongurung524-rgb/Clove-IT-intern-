{% extends 'base.html' %}
{% load static %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="fw-bold text-center mb-2">Contact Us</h1>
            <p class="text-muted text-center mb-5">Have questions? We'd love to hear from you.</p>
            
            <div class="row g-4 mb-5">
                <div class="col-md-4 text-center">
                    <i class="fas fa-map-marker-alt fa-2x text-primary mb-2"></i>
                    <h6>Address</h6>
                    <p class="text-muted small">Kathmandu, Nepal</p>
                </div>
                <div class="col-md-4 text-center">
                    <i class="fas fa-phone fa-2x text-primary mb-2"></i>
                    <h6>Phone</h6>
                    <p class="text-muted small">+977 9811017533</p>
                </div>
                <div class="col-md-4 text-center">
                    <i class="fas fa-envelope fa-2x text-primary mb-2"></i>
                    <h6>Email</h6>
                    <p class="text-muted small">support@roomfinder.com</p>
                </div>
            </div>
            
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-control" placeholder="Your name">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" placeholder="Your email">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" class="form-control" placeholder="Subject">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" rows="5" placeholder="Your message..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
